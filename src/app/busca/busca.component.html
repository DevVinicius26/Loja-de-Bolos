<div class="container my-5">
    <h2 class="mb-4 text-dark fw-bold">Resultados para: "{{ termoBusca }}"</h2>

    <!-- Se houver bolos correspondentes -->
    <div *ngIf="resultados.length > 0; else semResultados" class="row g-4">
        <div class="col-md-6 col-lg-3" *ngFor="let bolo of resultados">
            <div class="card h-100 border-0 shadow-sm rounded-4 overflow-hidden">
                <img [src]="bolo.imagem" class="card-img-top object-fit-cover" style="height: 200px;" alt="Bolo">
                <div class="card-body d-flex flex-column text-center p-4">
                    <h5 class="card-title fw-bold text-dark">{{ bolo.nome }}</h5>
                    <p class="card-text text-success fs-5 fw-bold my-2">R$ {{ bolo.preco.toFixed(2).replace('.', ',') }}</p>
                    <div class="d-flex gap-2 mt-auto">
                        <a [routerLink]="['/detalhe', bolo.nome]" class="btn btn-outline-secondary btn-sm rounded-pill w-50">Detalhes</a>
                        <button (click)="adicionar(bolo.nome, bolo.preco, bolo.imagem)" class="btn btn-danger btn-sm rounded-pill w-50">Comprar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Caso não encontre nenhum bolo -->
    <ng-template #semResultados>
        <div class="text-center py-5 bg-light rounded-4 shadow-sm">
            <h4 class="text-muted mb-3">Nenhum bolo encontrado 🔍</h4>
            <p class="text-secondary mb-4">Tente pesquisar por outro nome (ex: Chocolate, Cenoura, Ninho...).</p>
            <a routerLink="/" class="btn btn-danger rounded-pill px-4 py-2">Voltar à Vitrine</a>
        </div>
    </ng-template>
</div>
