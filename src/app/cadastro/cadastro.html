<div class="container my-5" style="max-width: 550px;">
    <div class="card border-0 shadow-sm rounded-4 p-4">
        <h3 class="text-center mb-4 text-danger fw-bold">Criar Nova Conta</h3>
        
        <form>
            <div class="mb-3">
                <label class="form-label text-secondary small">Nome Completo</label>
                <input type="text" class="form-control" placeholder="O seu nome completo" required>
            </div>

            <div class="mb-3">
                <label class="form-label text-secondary small">E-mail</label>
                <input type="email" class="form-control" placeholder="O seu e-mail" required>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label text-secondary small">Senha</label>
                    <input type="password" class="form-control" placeholder="Senha" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label text-secondary small">Confirma Senha</label>
                    <input type="password" class="form-control" placeholder="Confirme a senha" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label text-secondary small">CPF</label>
                <input type="text" class="form-control" placeholder="000.000.000-00" required>
            </div>

            <div class="mb-3">
                <label class="form-label text-secondary small">Telefone</label>
                <input type="text" class="form-control" placeholder="(00) 00000-0000" required>
            </div>

            <button type="submit" class="btn btn-success w-100 rounded-pill py-2 mb-3">Cadastrar</button>

            <div class="text-center small">
                <span class="text-muted">Já tem uma conta? </span>
<a href="/login" class="text-decoration-none text-danger fw-bold">Faça login</a>            </div>
        </form>
    </div>
</div>
